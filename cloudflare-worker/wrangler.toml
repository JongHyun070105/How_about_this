name = "reviewai-api-proxy"
main = "worker.js"
compatibility_date = "2026-04-21"

# Workers 플랜
workers_dev = true

# Smart Placement - Gemini API가 지원되는 리전에서 실행
[placement]
mode = "smart"

# KV Namespace for rate limiting (배포 후 생성 필요)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00cc2b1530ca499fbaef968ef9c7ca95"

# KV Namespace for general API caching
[[kv_namespaces]]
binding = "API_CACHE"
id = "7238157c15ff41a3bbdbbd25b8363784"

# Durable Object for Region Proxy
[[durable_objects.bindings]]
name = "GEMINI_PROXY_V2"
class_name = "GeminiProxyV2"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["GeminiProxyV2"]
deleted_classes = ["GeminiProxy"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true


# 환경 변수 (민감한 정보는 wrangler secret으로 설정)
[env.production]
# wrangler secret put GEMINI_API_KEY
# wrangler secret put JWT_SECRET
MIN_APP_VERSION = "1.0.0"

[env.staging]
# wrangler secret put GEMINI_API_KEY --env staging
# wrangler secret put JWT_SECRET --env staging
MIN_APP_VERSION = "1.0.0"
